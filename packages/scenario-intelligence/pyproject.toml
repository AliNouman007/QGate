[project]
name = "qgate-scenario-intelligence"
version = "0.1.0"
description = "QGate deterministic scenario planning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9.0",
  "qgate-project-intelligence",
  "qgate-impact-analysis",
]

[project.scripts]
qgate-scenario-intelligence = "qgate_scenario_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_scenario_intelligence"]
