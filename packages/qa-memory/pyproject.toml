[project]
name = "qgate-qa-memory"
version = "0.1.0"
description = "QGate human-confirmed QA memory and deterministic regression recall"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9.0",
  "qgate-project-intelligence",
  "qgate-impact-analysis",
  "qgate-browser-execution",
]

[project.scripts]
qgate-qa-memory = "qgate_qa_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_qa_memory"]
