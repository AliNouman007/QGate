[project]
name = "qgate-project-intelligence"
version = "0.1.0"
description = "QGate deterministic project intelligence and codebase mapping"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9.0",
]

[project.scripts]
qgate-project-intelligence = "qgate_project_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_project_intelligence"]
