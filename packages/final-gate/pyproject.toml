[project]
name = "qgate-final-gate"
version = "0.1.0"
description = "QGate strict final QA verdict engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9.0",
  "qgate-project-intelligence",
  "qgate-impact-analysis",
  "qgate-scenario-intelligence",
  "qgate-browser-execution",
  "qgate-qa-memory",
]

[project.scripts]
qgate-final-gate = "qgate_final_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_final_gate"]
