[project]
name = "qgate-impact-analysis"
version = "0.1.0"
description = "QGate deterministic code change impact and blast-radius analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9.0",
  "qgate-project-intelligence",
]

[project.scripts]
qgate-impact-analysis = "qgate_impact_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_impact_analysis"]
