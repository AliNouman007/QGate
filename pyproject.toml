[project]
name = "suitest-monorepo"
version = "0.4.0"
description = "Suitest OSS monorepo root"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/runner",
  "packages/agent",
  "packages/core",
  "packages/db",
  "packages/mcp",
  "packages/shared",
  "packages/lifecycle",
  "packages/project-intelligence",
  "packages/impact-analysis",
  "packages/scenario-intelligence",
  "packages/browser-execution",
  "packages/qa-memory",
  "packages/final-gate",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "asgi-lifespan>=2.1.0",
  "pre-commit>=4.0.0",
  "aiosqlite>=0.20.0",
  "fakeredis>=2.26.0",
  "respx>=0.21.0",
  "httpx-ws>=0.7.0",
  "types-PyYAML>=6.0",
  "suitest-agent[cloud]",
  "suiflex-suitest-lifecycle[frontend]",
]

[tool.uv.sources]
suitest-api = { workspace = true }
suitest-runner = { workspace = true }
suitest-agent = { workspace = true }
suitest-core = { workspace = true }
suitest-db = { workspace = true }
suitest-mcp = { workspace = true }
suitest-shared = { workspace = true }
suiflex-suitest-lifecycle = { workspace = true }
qgate-project-intelligence = { workspace = true }
qgate-impact-analysis = { workspace = true }
qgate-scenario-intelligence = { workspace = true }
qgate-browser-execution = { workspace = true }
qgate-qa-memory = { workspace = true }
qgate-final-gate = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages"]
extend-exclude = ["alembic/versions", "packages/mcp-npx/python"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
  "RUF",
  "SIM",
  "TCH",
]
ignore = ["E501", "RUF101"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "suitest_db.base.Base",
  "sqlalchemy.orm.DeclarativeBase",
  "pydantic.BaseModel",
  "suitest_shared.domain.base.DomainModel",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["B018", "TCH001", "TCH002", "TCH003"]
"apps/api/src/suitest_api/deps/*.py" = ["B008", "TCH001", "TCH002", "TCH003"]
"apps/api/src/suitest_api/routers/*.py" = ["B008", "TCH001", "TCH002", "TCH003"]
"apps/api/src/suitest_api/services/*.py" = ["TCH001", "TCH002", "TCH003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "apps/runner/src", "packages/agent/src", "packages/core/src", "packages/db/src", "packages/lifecycle/src", "packages/mcp/src", "packages/shared/src", "packages/project-intelligence/src", "packages/impact-analysis/src", "packages/scenario-intelligence/src", "packages/browser-execution/src", "packages/qa-memory/src", "packages/final-gate/src", "packages/db/tests", "packages/mcp/tests", "packages/agent/tests", "apps/api/tests"]
explicit_package_bases = true
namespace_packages = true
exclude = "(^|/)(\\.venv|alembic/versions|node_modules|dist|build|tests|mcp-npx/python)/"

[[tool.mypy.overrides]]
module = ["alembic.*", "fastembed.*", "cuid2.*", "pgvector.*", "testcontainers.*", "jsonpath_ng.*", "respx.*", "fakeredis.*", "aioboto3.*", "botocore.*", "moto.*", "boto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["suitest_db.models.user"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["suitest_runner.worker"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["apps/api/tests", "apps/runner/tests", "packages/core/tests", "packages/db/tests", "packages/mcp/tests", "packages/shared/tests", "packages/agent/tests", "packages/project-intelligence/tests", "packages/impact-analysis/tests", "packages/scenario-intelligence/tests", "packages/browser-execution/tests", "packages/qa-memory/tests", "packages/final-gate/tests"]
addopts = "-ra -q --strict-markers --import-mode=importlib"
markers = [
    "e2e: end-to-end smoke / integration test. Two flavours: (a) live docker-compose stack (M1c DoD, ``tests/e2e/``) — opt-in via the M1c E2E workflow; (b) testcontainer-driven in-process E2E (M1d-29, ``apps/api/tests/e2e/``) — runs in the default ``pytest`` invocation because it self-provisions Postgres via testcontainers and mocks every external network call. Use ``pytest -m 'not e2e'`` to deselect both.",
]
