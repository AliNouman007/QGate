name: release-please

# Version + changelog automation for the three published npm packages:
#   - packages/mcp-npx     → @suiflex/suitest-mcp  → tag mcp-v*      → release-mcp.yml
#   - sdk/typescript       → @suiflex/suitest-sdk  → tag tssdk-v*    → release-ts-sdk.yml
#   - packages/suitest-npx → @suiflex/suitest      → tag launcher-v* → release-launcher.yml
# Run this workflow manually to prepare release PRs. Merging to main does not
# create release tags or publish packages automatically. Publishing is performed
# by manually dispatching the package workflow against an existing tag after the
# release commit is on main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT is required for the release tag to trigger release-mcp.yml:
          # tags pushed with the default GITHUB_TOKEN do NOT re-trigger other
          # workflows. Set RELEASE_PLEASE_TOKEN (repo/workflow scope) to enable
          # auto-publish; without it the tag is still created but the npm/PyPI
          # publish must be started manually (re-push the tag or run the workflow).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
